# Deploys the site to GitHub Pages whenever you push to `main`.
#
# One-time setup in your repository on GitHub:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# GitHub Free only serves Pages from PUBLIC repositories. See README.md ("Deploy")
# before choosing GitHub Pages for a repo that holds unfinished or private content.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5
        id: pages

      # The default relative base path ("./") works on a project page such as
      # https://<user>.github.io/<repo>/ with no extra Vite configuration.
      # SITE_URL only feeds the canonical URL and social-preview tags.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
