<!doctype html>

-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 180px; height: 180px; overflow: hidden; background: #050816; }
      body { display: grid; place-items: center; font-family: 'Geist', system-ui, sans-serif; }
      .mark {
        width: 140px; height: 140px; border-radius: 36px; display: grid; place-items: center;
        font-weight: 700; font-size: 62px; letter-spacing: -3px; color: #d6ebff;
        border: 5px solid transparent;
        background: linear-gradient(#0a1130, #0a1130) padding-box, linear-gradient(120deg, #22d3ee, #5b8cff 55%, #9a7bff) border-box;
      }
    </style>
  </head>
  <body>
    <div class="mark">SP</div>
  </body>
